version: 2

models:
  - name: stg_campaigns

    columns:
      - name: campaign_id
        data_tests:
          - not_null
          - unique
      
      - name: account_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ad_accounts')
                field: account_id

      - name: objective
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - awareness
                  - sales
                  - leads
                  - traffic

      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - enabled
                  - paused
                  - removed